{% extends "base.html" %}

{% block content %}

<div class="container py-5" style="max-width: 720px;">

    <div class="card shadow-sm border-warning">

        <div class="card-body p-4">

            <h3 class="mb-3 text-warning">
                ⚠ Work Order is currently in use
            </h3>

            <p class="mb-3">
                Work Order
                <strong>#{{ wo.id }}</strong>
                is currently being edited by:
            </p>

            <div class="alert alert-warning mb-4">

                <div class="fw-bold fs-5">
                    {{ lock_row.username if lock_row else "Another user" }}
                </div>

                <div class="small text-muted mt-1">
                    This Work Order cannot be edited by two users
                    at the same time.
                </div>

            </div>

            <div class="d-flex gap-2">

                <a
                    href="{{ url_for('inventory.wo_detail', wo_id=wo.id) }}"
                    class="btn btn-secondary"
                >
                    Back
                </a>

                <a
                    href="{{ url_for('inventory.wo_edit', wo_id=wo.id, readonly=1) }}"
                    class="btn btn-outline-primary"
                >
                    Open Read Only
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
