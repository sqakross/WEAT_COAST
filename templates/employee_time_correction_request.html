
{% extends "base.html" %}
{% block content %}
<div class="container py-4" style="max-width:720px">
<h3>Request Shift Correction #{{ shift.id }}</h3>
<p class="text-muted">
Pacific Time. This request will not change recorded hours.
</p>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<input type="hidden" name="expected_start"
       value="{{ expected_start }}">
<input type="hidden" name="expected_end"
       value="{{ expected_end }}">

<div class="mb-3">
<label class="form-label">Requested Start</label>
<input type="datetime-local" class="form-control"
       name="started_at" value="{{ started_at }}" required>
</div>

<div class="mb-3">
<label class="form-label">Requested End</label>
<input type="datetime-local" class="form-control"
       name="ended_at" value="{{ ended_at }}" required>
</div>

<div class="mb-3">
<label class="form-label">Reason for Correction</label>
<textarea class="form-control" name="reason"
          minlength="4" maxlength="1000"
          rows="3" required></textarea>
</div>

<button class="btn btn-primary" type="submit">
Submit Request
</button>
<a class="btn btn-outline-secondary"
   href="{{ url_for('auth.my_time') }}">Cancel</a>
</form>
</div>
{% endblock %}
